[project]
site_name = "Payments, Risk & AI Interview Prep Portal"
site_description = "Executive interview preparation portal for Payment Networks, Acquirers, Fraud Risk, Analytics, and AI Systems."
site_author = "Vincent Yuan"
docs_dir = "docs"
repo_url = "https://github.com/Realvincentyuan/fi_ds_interview_prep"
repo_name = "Realvincentyuan/fi_ds_interview_prep"
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
  { "Home" = "index.md" },
  { "Payment Systems" = [
      { "01. Payment Systems & Card Networks" = "01_payment_systems_and_networks/README.md" },
      { "02. Fraud Detection & Risk Management" = "02_fraud_detection_and_risk/README.md" },
  ]},
  { "Analytics & ML" = [
      { "03. Data Analytics & Experimentation" = "03_data_analytics/README.md" },
      { "05. Machine Learning & Credit Scorecards" = [
          { "Overview & Reading Guide" = "05_ml_algorithms/README.md" },
          { "01. Financial Models Deep Dive" = "05_ml_algorithms/01_financial_models_deep_dive.md" },
          { "02. Fraud Detection ML Implementation" = "05_ml_algorithms/02_fraud_detection_ml_implementation.md" },
          { "03. Data Science Interview Q&A" = "05_ml_algorithms/03_data_science_interview_qa.md" },
          { "04. Graph Neural Networks for Fraud" = "05_ml_algorithms/04_graph_neural_networks_fraud_detection.md" },
      ]},
  ]},
  { "AI & LLM Agents" = [
      { "04. AI Fundamentals, Transformers & Agents" = "04_ai_fundamentals/README.md" },
  ]},
  { "Case Studies" = [
      { "System Design & Case Framework" = "06_case_studies/README.md" },
      { "Case 1: Real-Time Fraud Engine (<40ms)" = "06_case_studies/case_01_realtime_fraud_detection.md" },
      { "Case 2: Smart Payment Routing Optimization" = "06_case_studies/case_02_payment_routing_authorization.md" },
      { "Case 3: Amusement Park P&L & Bidding Strategy" = "06_case_studies/case_03_amusement_park_business_case.md" },
      { "Case 4: Co-Working Space Unit Economics" = "06_case_studies/case_04_coworking_space_business_case.md" },
      { "Case 5: Uniform-Price Auction & Game Theory" = "06_case_studies/case_05_power_market_uniform_price_auction.md" },
      { "Case 6: Mobile Gaming App Freemium & Cannibalization" = "06_case_studies/case_06_mobile_gaming_freemium_cannibalization.md" },
      { "Case 7: Credit Card Streaming Video Ad Campaign" = "06_case_studies/case_07_streaming_ad_campaign_credit_card.md" },
      { "Case 8: Credit Card P&L, Tiering & DB Outage" = "06_case_studies/case_08_credit_card_tier_segmentation_database_glitch.md" },
      { "Case 9: Default Collections & Cannibalization" = "06_case_studies/case_09_debt_collections_cannibalization_breakeven.md" },
  ]},
]



[project.theme]
variant = "modern"
language = "en"
features = [
  "announce.dismiss",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  "toc.integrate",
]

[project.theme.font]
text = "Plus Jakarta Sans"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.validation]
invalid_links = false
invalid_link_anchors = false

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex = { generic = true, smart_dollar = true }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
